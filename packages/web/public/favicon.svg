<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="CITIZEN-0">
  <defs>
    <linearGradient id="c0-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="c0-ring" x1="18" y1="14" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E4E4E7"/>
      <stop offset="1" stop-color="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="c0-glow" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#c0-bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#c0-ring)" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- soft violet wash -->
  <ellipse cx="32" cy="28" rx="18" ry="16" fill="url(#c0-glow)"/>
  <!-- geometric zero: outer ring -->
  <circle cx="32" cy="32" r="15.5" stroke="url(#c0-ring)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- inner cut for depth -->
  <circle cx="32" cy="32" r="8.25" stroke="#27272A" stroke-width="3.25"/>
  <!-- violet accent tick on the zero -->
  <path d="M42.5 22.5c2.8 2.6 4.5 6.3 4.5 10.5" stroke="#A855F7" stroke-width="2.75" stroke-linecap="round"/>
</svg>
